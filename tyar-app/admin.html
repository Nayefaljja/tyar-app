<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تيار — لوحة تحكم الإعلانات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3CAEA3;
            --primary-d: #2a9d8f;
            --navy: #0f2744;
            --bg: #f0f7f6;
            --surface: #ffffff;
            --surface2: #f8fafc;
            --text: #0f2744;
            --text-soft: #4a6280;
            --text-muted: #7a94b0;
            --border: #d1e8e5;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #f59e0b;
            --shadow-sm: 0 2px 8px rgba(15,39,68,.07);
            --shadow-md: 0 6px 24px rgba(15,39,68,.11);
            --r: 14px;
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
        a { text-decoration:none; color:inherit; }

        /* ── Header ── */
        header {
            background:var(--navy);
            padding: 0 5%;
            display:flex; align-items:center; justify-content:space-between;
            height:62px;
            position:sticky; top:0; z-index:100;
        }
        .hdr-logo { height:38px; }
        .hdr-title { color:#fff; font-size:1rem; font-weight:700; display:flex; align-items:center; gap:8px; }
        .hdr-title i { color:var(--primary); }
        .hdr-back {
            display:flex; align-items:center; gap:6px;
            color:rgba(255,255,255,.7); font-size:0.85rem;
            transition:color .2s;
        }
        .hdr-back:hover { color:#fff; }

        /* ── Main ── */
        .main { max-width:1200px; margin:0 auto; padding:32px 5% 60px; }

        /* ── Stats row ── */
        .stats-row {
            display:grid; grid-template-columns:repeat(4,1fr); gap:16px;
            margin-bottom:32px;
        }
        .stat-box {
            background:var(--surface); border-radius:var(--r);
            padding:20px 22px; border:1px solid var(--border);
            box-shadow:var(--shadow-sm);
            display:flex; align-items:center; gap:16px;
        }
        .stat-icon {
            width:46px; height:46px; border-radius:12px;
            display:flex; align-items:center; justify-content:center;
            font-size:1.3rem; flex-shrink:0;
        }
        .si-all     { background:rgba(60,174,163,.1); color:var(--primary); }
        .si-pending { background:rgba(245,158,11,.1);  color:var(--yellow); }
        .si-approved{ background:rgba(34,197,94,.1);   color:var(--green); }
        .si-rejected{ background:rgba(239,68,68,.1);   color:var(--red); }
        .stat-info { line-height:1.3; }
        .stat-num  { font-size:1.8rem; font-weight:800; }
        .stat-lbl  { font-size:0.8rem; color:var(--text-soft); }

        /* ── Filter tabs ── */
        .filter-tabs {
            display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;
        }
        .tab {
            padding:8px 20px; border-radius:50px;
            border:1.5px solid var(--border);
            background:var(--surface); cursor:pointer;
            font-family:'Tajawal',sans-serif; font-size:0.88rem; font-weight:600;
            color:var(--text-soft); transition:all .2s; display:flex; align-items:center; gap:6px;
        }
        .tab:hover { border-color:var(--primary); color:var(--primary); }
        .tab.active { background:var(--primary); border-color:var(--primary); color:#fff; }
        .tab .badge {
            background:rgba(255,255,255,.25); color:inherit;
            min-width:20px; height:20px; border-radius:50px;
            font-size:0.72rem; padding:0 6px;
            display:inline-flex; align-items:center; justify-content:center;
        }
        .tab:not(.active) .badge { background:var(--border); color:var(--text-muted); }

        /* ── Empty state ── */
        .empty-state {
            text-align:center; padding:80px 20px;
            color:var(--text-muted);
        }
        .empty-state i { font-size:3rem; margin-bottom:16px; opacity:.4; display:block; }
        .empty-state p { font-size:1rem; }

        /* ── Listing cards ── */
        .listings-grid {
            display:grid; grid-template-columns:repeat(auto-fill, minmax(360px,1fr));
            gap:20px;
        }

        .admin-card {
            background:var(--surface); border-radius:var(--r);
            border:1px solid var(--border); box-shadow:var(--shadow-sm);
            overflow:hidden; transition:box-shadow .2s;
        }
        .admin-card:hover { box-shadow:var(--shadow-md); }
        .admin-card.status-approved { border-color:rgba(34,197,94,.4); }
        .admin-card.status-rejected { border-color:rgba(239,68,68,.3); opacity:.7; }

        .card-img {
            position:relative; height:200px; overflow:hidden;
            background:#e2e8f0;
        }
        .card-img img { width:100%; height:100%; object-fit:cover; transition:transform .4s; }
        .admin-card:hover .card-img img { transform:scale(1.04); }

        .card-status-badge {
            position:absolute; top:12px; right:12px;
            padding:4px 12px; border-radius:50px;
            font-size:0.75rem; font-weight:700;
        }
        .badge-pending  { background:var(--yellow); color:#fff; }
        .badge-approved { background:var(--green);  color:#fff; }
        .badge-rejected { background:var(--red);    color:#fff; }

        .card-time {
            position:absolute; bottom:10px; left:10px;
            background:rgba(0,0,0,.55); color:#fff;
            font-size:0.7rem; padding:3px 8px; border-radius:6px;
        }

        .card-body { padding:16px 18px; }

        .card-header {
            display:flex; justify-content:space-between; align-items:flex-start;
            margin-bottom:12px;
        }
        .card-model { font-size:1.05rem; font-weight:800; }
        .card-year  { font-size:0.8rem; color:var(--text-muted); margin-top:2px; }
        .card-price { font-size:1.1rem; font-weight:800; color:var(--primary); white-space:nowrap; }

        .card-specs {
            display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;
        }
        .spec {
            display:flex; align-items:center; gap:5px;
            background:var(--surface2); border:1px solid var(--border);
            border-radius:8px; padding:4px 10px;
            font-size:0.78rem; color:var(--text-soft);
        }
        .spec i { color:var(--primary); font-size:0.72rem; }

        .battery-row { margin-bottom:12px; }
        .battery-label { display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-muted); margin-bottom:4px; }
        .battery-bar { height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
        .battery-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,#22c55e,#4ade80); }

        .card-desc {
            font-size:0.83rem; color:var(--text-soft); line-height:1.65;
            margin-bottom:14px; border-top:1px solid var(--border); padding-top:12px;
        }

        .card-contact {
            font-size:0.8rem; color:var(--text-muted); margin-bottom:14px;
            display:flex; align-items:center; gap:6px;
        }
        .card-contact i { color:var(--primary); }

        .card-actions { display:flex; gap:8px; }

        .btn-approve, .btn-reject, .btn-undo {
            flex:1; padding:10px 0;
            border:none; border-radius:10px;
            font-family:'Tajawal',sans-serif; font-size:0.9rem; font-weight:700;
            cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
            transition:all .2s;
        }
        .btn-approve {
            background:linear-gradient(135deg,#22c55e,#16a34a);
            color:#fff;
        }
        .btn-approve:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(34,197,94,.35); }
        .btn-reject {
            background:var(--surface2); border:1.5px solid var(--border);
            color:var(--red);
        }
        .btn-reject:hover { background:#fef2f2; border-color:var(--red); transform:translateY(-2px); }
        .btn-undo {
            background:var(--surface2); border:1.5px solid var(--border);
            color:var(--text-soft);
        }
        .btn-undo:hover { border-color:var(--primary); color:var(--primary); }

        /* ── Toast ── */
        .toast {
            position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
            background:var(--navy); color:#fff;
            padding:12px 24px; border-radius:50px;
            font-size:0.9rem; font-weight:600;
            opacity:0; transition:all .3s; z-index:999; pointer-events:none;
            display:flex; align-items:center; gap:8px;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .toast.toast-green { background:#16a34a; }
        .toast.toast-red   { background:#dc2626; }

        /* ── Responsive ── */
        @media(max-width:768px) {
            .stats-row { grid-template-columns:repeat(2,1fr); }
            .listings-grid { grid-template-columns:1fr; }
        }
        @media(max-width:480px) {
            .stats-row { grid-template-columns:1fr 1fr; }
        }
    </style>
</head>
<body>

<header>
    <img src="images/tyar-logo-transparent.png" alt="تيار" class="hdr-logo">
    <div class="hdr-title"><i class="fas fa-shield-alt"></i> لوحة تحكم الإعلانات</div>
    <a href="marketplace.html" class="hdr-back"><i class="fas fa-arrow-left"></i> العودة للسوق</a>
</header>

<div class="main">

    <!-- Stats -->
    <div class="stats-row" id="statsRow">
        <div class="stat-box">
            <div class="stat-icon si-all"><i class="fas fa-list"></i></div>
            <div class="stat-info">
                <div class="stat-num" id="cnt-all">0</div>
                <div class="stat-lbl">إجمالي الإعلانات</div>
            </div>
        </div>
        <div class="stat-box">
            <div class="stat-icon si-pending"><i class="fas fa-clock"></i></div>
            <div class="stat-info">
                <div class="stat-num" id="cnt-pending">0</div>
                <div class="stat-lbl">بانتظار المراجعة</div>
            </div>
        </div>
        <div class="stat-box">
            <div class="stat-icon si-approved"><i class="fas fa-check-circle"></i></div>
            <div class="stat-info">
                <div class="stat-num" id="cnt-approved">0</div>
                <div class="stat-lbl">تم نشرها</div>
            </div>
        </div>
        <div class="stat-box">
            <div class="stat-icon si-rejected"><i class="fas fa-times-circle"></i></div>
            <div class="stat-info">
                <div class="stat-num" id="cnt-rejected">0</div>
                <div class="stat-lbl">تم رفضها</div>
            </div>
        </div>
    </div>

    <!-- Filter tabs -->
    <div class="filter-tabs">
        <button class="tab active" onclick="setFilter('all',this)">
            <i class="fas fa-th-large"></i> الكل
            <span class="badge" id="tab-all-badge">0</span>
        </button>
        <button class="tab" onclick="setFilter('pending',this)">
            <i class="fas fa-clock"></i> بانتظار المراجعة
            <span class="badge" id="tab-pending-badge">0</span>
        </button>
        <button class="tab" onclick="setFilter('approved',this)">
            <i class="fas fa-check-circle"></i> تم النشر
            <span class="badge" id="tab-approved-badge">0</span>
        </button>
        <button class="tab" onclick="setFilter('rejected',this)">
            <i class="fas fa-times-circle"></i> مرفوضة
            <span class="badge" id="tab-rejected-badge">0</span>
        </button>
    </div>

    <!-- Grid -->
    <div class="listings-grid" id="listingsGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
        <i class="fas fa-inbox"></i>
        <p id="emptyMsg">لا توجد إعلانات بعد</p>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    const CITY_NAMES = {
        riyadh:'الرياض', jeddah:'جدة', dammam:'الدمام',
        makkah:'مكة المكرمة', madinah:'المدينة المنورة', khobar:'الخبر'
    };
    const STATUS_LABELS = { pending:'بانتظار المراجعة', approved:'تم النشر', rejected:'مرفوض' };
    const STATUS_BADGES = { pending:'badge-pending', approved:'badge-approved', rejected:'badge-rejected' };

    let currentFilter = 'all';

    function getListings() {
        return JSON.parse(localStorage.getItem('tyar_listings') || '[]');
    }

    function saveListings(arr) {
        localStorage.setItem('tyar_listings', JSON.stringify(arr));
    }

    function updateStatus(id, status) {
        const all = getListings();
        const idx = all.findIndex(l => l.id === id);
        if (idx === -1) return;
        all[idx].status = status;
        saveListings(all);
        render();
        showToast(
            status === 'approved'
                ? '<i class="fas fa-check-circle"></i> تم قبول الإعلان ونشره في السوق'
                : '<i class="fas fa-times-circle"></i> تم رفض الإعلان',
            status === 'approved' ? 'toast-green' : 'toast-red'
        );
    }

    function showToast(msg, cls = '') {
        const t = document.getElementById('toast');
        t.innerHTML = msg;
        t.className = 'toast show ' + cls;
        setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    function setFilter(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function formatDate(iso) {
        const d = new Date(iso);
        return d.toLocaleDateString('ar-SA', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    }

    function render() {
        const all = getListings();
        const filtered = currentFilter === 'all' ? all : all.filter(l => l.status === currentFilter);

        // Update stat counters
        document.getElementById('cnt-all').textContent      = all.length;
        document.getElementById('cnt-pending').textContent  = all.filter(l=>l.status==='pending').length;
        document.getElementById('cnt-approved').textContent = all.filter(l=>l.status==='approved').length;
        document.getElementById('cnt-rejected').textContent = all.filter(l=>l.status==='rejected').length;

        // Update tab badges
        document.getElementById('tab-all-badge').textContent      = all.length;
        document.getElementById('tab-pending-badge').textContent  = all.filter(l=>l.status==='pending').length;
        document.getElementById('tab-approved-badge').textContent = all.filter(l=>l.status==='approved').length;
        document.getElementById('tab-rejected-badge').textContent = all.filter(l=>l.status==='rejected').length;

        const grid  = document.getElementById('listingsGrid');
        const empty = document.getElementById('emptyState');
        grid.innerHTML = '';

        if (!filtered.length) {
            empty.style.display = 'block';
            const msgs = { all:'لا توجد إعلانات حتى الآن', pending:'لا توجد إعلانات بانتظار المراجعة', approved:'لا توجد إعلانات منشورة', rejected:'لا توجد إعلانات مرفوضة' };
            document.getElementById('emptyMsg').textContent = msgs[currentFilter];
            return;
        }

        empty.style.display = 'none';

        // Sort: pending first
        const sorted = [...filtered].sort((a,b) => {
            const order = { pending:0, approved:1, rejected:2 };
            return (order[a.status]??3) - (order[b.status]??3) || b.id - a.id;
        });

        sorted.forEach(l => {
            const card = document.createElement('div');
            card.className = `admin-card status-${l.status}`;

            const isPending  = l.status === 'pending';
            const isApproved = l.status === 'approved';
            const isRejected = l.status === 'rejected';

            const actionBtns = isPending ? `
                <button class="btn-approve" onclick="updateStatus(${l.id},'approved')">
                    <i class="fas fa-check"></i> قبول ونشر
                </button>
                <button class="btn-reject" onclick="updateStatus(${l.id},'rejected')">
                    <i class="fas fa-times"></i> رفض
                </button>` : isApproved ? `
                <button class="btn-undo" onclick="updateStatus(${l.id},'pending')">
                    <i class="fas fa-undo"></i> إعادة للمراجعة
                </button>
                <button class="btn-reject" onclick="updateStatus(${l.id},'rejected')">
                    <i class="fas fa-times"></i> إلغاء النشر
                </button>` : `
                <button class="btn-approve" onclick="updateStatus(${l.id},'approved')">
                    <i class="fas fa-check"></i> قبول ونشر
                </button>
                <button class="btn-undo" onclick="updateStatus(${l.id},'pending')">
                    <i class="fas fa-undo"></i> إعادة للمراجعة
                </button>`;

            card.innerHTML = `
                <div class="card-img">
                    <img src="${l.photo}" alt="${l.model_display}" loading="lazy">
                    <span class="card-status-badge ${STATUS_BADGES[l.status]}">${STATUS_LABELS[l.status]}</span>
                    <span class="card-time"><i class="fas fa-clock"></i> ${formatDate(l.submittedAt)}</span>
                </div>
                <div class="card-body">
                    <div class="card-header">
                        <div>
                            <div class="card-model">${l.model_display}</div>
                            <div class="card-year">${l.year} • ${Number(l.km).toLocaleString()} كم</div>
                        </div>
                        <div class="card-price">${Number(l.price_sar).toLocaleString()} ر.س</div>
                    </div>
                    <div class="card-specs">
                        <div class="spec"><i class="fas fa-palette"></i> ${l.color}</div>
                        <div class="spec"><i class="fas fa-map-marker-alt"></i> ${CITY_NAMES[l.city]||l.city}</div>
                        <div class="spec"><i class="fas fa-calendar"></i> ${l.year}</div>
                        <div class="spec"><i class="fas fa-battery-three-quarters"></i> ${l.battery_pct}%</div>
                    </div>
                    <div class="battery-row">
                        <div class="battery-label"><span>صحة البطارية</span><span>${l.battery_pct}%</span></div>
                        <div class="battery-bar"><div class="battery-fill" style="width:${l.battery_pct}%"></div></div>
                    </div>
                    ${l.desc_ar ? `<div class="card-desc">${l.desc_ar}</div>` : ''}
                    ${l.phone ? `<div class="card-contact"><i class="fas fa-phone"></i> ${l.phone}</div>` : ''}
                    <div class="card-actions">${actionBtns}</div>
                </div>`;

            grid.appendChild(card);
        });
    }

    // Listen for changes from other tabs (marketplace submits)
    window.addEventListener('storage', e => {
        if (e.key === 'tyar_listings') render();
    });

    render();
</script>
</body>
</html>
