<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TYAR Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #3CAEA3; --navy: #0f2744; --navy2: #162f52;
      --gold: #F4A923; --danger: #e05252;
      --bg: #0b1e36; --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.1); --text: #e8f0fe; --sub: #8aa4c8;
      --radius: 12px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Login ── */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-card { background: var(--navy2); border: 1px solid var(--border); border-radius: 20px; padding: 48px 40px; width: 100%; max-width: 400px; text-align: center; }
    .login-logo { font-size: 32px; font-weight: 800; color: var(--primary); letter-spacing: -1px; margin-bottom: 4px; }
    .login-sub { color: var(--sub); font-size: 14px; margin-bottom: 36px; }
    .field { margin-bottom: 16px; text-align: left; }
    .field label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
    .field input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; font-family: inherit; transition: border-color .2s; }
    .field input:focus { outline: none; border-color: var(--primary); }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: opacity .2s, transform .1s; font-family: inherit; }
    .btn:hover { opacity: .85; } .btn:active { transform: scale(.97); } .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-danger  { background: var(--danger);  color: #fff; }
    .btn-gold    { background: var(--gold);    color: #000; }
    .btn-ghost   { background: rgba(255,255,255,.08); color: var(--text); }
    .btn-full    { width: 100%; justify-content: center; }
    .error-msg { background: rgba(224,82,82,.15); border: 1px solid rgba(224,82,82,.4); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #f79090; margin-top: 12px; display: none; }
    .error-msg.show { display: block; }

    /* ── Dashboard ── */
    #dashboard { display: none; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; background: var(--navy2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .topbar-brand { font-size: 20px; font-weight: 800; color: var(--primary); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .topbar-email { font-size: 13px; color: var(--sub); }
    .tabs-bar { display: flex; gap: 4px; padding: 16px 28px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab-btn { padding: 10px 20px; border-radius: 8px 8px 0 0; border: none; background: transparent; color: var(--sub); font-size: 14px; font-weight: 500; cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 8px; white-space: nowrap; font-family: inherit; }
    .tab-btn:hover { color: var(--text); background: rgba(255,255,255,.04); }
    .tab-btn.active { color: var(--primary); background: rgba(60,174,163,.1); border-bottom: 2px solid var(--primary); }
    .badge { background: var(--gold); color: #000; border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 700; }
    .tab-panel { display: none; padding: 28px; }
    .tab-panel.active { display: block; }

    /* Filter */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--sub); font-size: 13px; cursor: pointer; transition: all .2s; font-family: inherit; }
    .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
    .filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
    .car-title { font-size: 18px; font-weight: 700; }
    .car-price { font-size: 18px; font-weight: 700; color: var(--primary); }
    .meta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
    .meta-item { font-size: 13px; color: var(--sub); }
    .meta-item strong { color: var(--text); display: block; font-size: 14px; }
    .seller-block { background: rgba(255,255,255,.04); border-radius: 8px; padding: 12px; margin-bottom: 14px; display: flex; gap: 24px; flex-wrap: wrap; }
    .seller-block span { font-size: 13px; color: var(--sub); }
    .seller-block strong { color: var(--text); }
    .desc-text { font-size: 13px; color: var(--sub); margin-bottom: 14px; line-height: 1.5; }
    .card-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .note-input { flex: 1; min-width: 200px; background: rgba(255,255,255,.06); border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; color: var(--text); font-size: 13px; font-family: inherit; }
    .note-input:focus { outline: none; border-color: var(--primary); }

    /* Status */
    .status-badge { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
    .status-pending   { background: rgba(244,169,35,.2);  color: var(--gold);    border: 1px solid rgba(244,169,35,.4); }
    .status-approved  { background: rgba(60,174,163,.2);  color: var(--primary); border: 1px solid rgba(60,174,163,.4); }
    .status-rejected  { background: rgba(224,82,82,.2);   color: var(--danger);  border: 1px solid rgba(224,82,82,.4); }
    .status-contacted { background: rgba(100,149,237,.2); color: #849fef; border: 1px solid rgba(100,149,237,.3); }
    .status-scheduled { background: rgba(147,112,219,.2); color: #b39ddb; border: 1px solid rgba(147,112,219,.3); }
    .status-completed { background: rgba(60,174,163,.2);  color: var(--primary); border: 1px solid rgba(60,174,163,.4); }
    .status-cancelled { background: rgba(224,82,82,.2);   color: var(--danger);  border: 1px solid rgba(224,82,82,.4); }

    /* Booking */
    .booking-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .booking-info { flex: 1; min-width: 200px; }
    .booking-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .booking-meta { font-size: 13px; color: var(--sub); line-height: 1.8; }
    .booking-meta strong { color: var(--text); }
    .booking-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .status-select { background: rgba(255,255,255,.08); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; }
    .status-select:focus { outline: none; border-color: var(--primary); }

    /* Loading */
    .loading { text-align: center; padding: 60px 20px; color: var(--sub); }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(60,174,163,.2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 60px 20px; color: var(--sub); font-size: 15px; }
    .date-small { font-size: 12px; color: var(--sub); }

    @media (max-width: 600px) {
      .topbar, .tabs-bar, .tab-panel { padding-left: 16px; padding-right: 16px; }
      .login-card { padding: 32px 24px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">TYAR | تيار</div>
    <div class="login-sub">Admin Panel</div>
    <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="admin@tyar.sa" autocomplete="email"></div>
    <div class="field"><label>Password</label><input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-full" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-brand">TYAR Admin</div>
    <div class="topbar-right">
      <span class="topbar-email" id="admin-email"></span>
      <button class="btn btn-ghost" onclick="doLogout()">Sign Out</button>
    </div>
  </div>
  <div class="tabs-bar">
    <button class="tab-btn active" onclick="showTab('listings')" id="tab-listings">🚗 Car Listings <span class="badge" id="badge-listings">0</span></button>
    <button class="tab-btn" onclick="showTab('charger')" id="tab-charger">⚡ Charger Bookings <span class="badge" id="badge-charger">0</span></button>
    <button class="tab-btn" onclick="showTab('maintenance')" id="tab-maintenance">🔧 Maintenance <span class="badge" id="badge-maintenance">0</span></button>
  </div>

  <!-- Tab: Car Listings -->
  <div class="tab-panel active" id="panel-listings">
    <div class="filter-bar" id="listings-filters">
      <button class="filter-btn active" onclick="filterListings('all',this)">All</button>
      <button class="filter-btn" onclick="filterListings('pending',this)">⏳ Pending</button>
      <button class="filter-btn" onclick="filterListings('approved',this)">✓ Approved</button>
      <button class="filter-btn" onclick="filterListings('rejected',this)">✗ Rejected</button>
    </div>
    <div id="listings-container"><div class="loading"><div class="spinner"></div>Loading…</div></div>
  </div>

  <!-- Tab: Charger Bookings -->
  <div class="tab-panel" id="panel-charger">
    <div id="charger-container"><div class="loading"><div class="spinner"></div>Loading…</div></div>
  </div>

  <!-- Tab: Maintenance -->
  <div class="tab-panel" id="panel-maintenance">
    <div id="maintenance-container"><div class="loading"><div class="spinner"></div>Loading…</div></div>
  </div>
</div>

<script>
const SUPABASE_URL  = 'https://gfqafbubvdrpjgimtert.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmcWFmYnVidmRycGpnaW10ZXJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4NTQzMDYsImV4cCI6MjA4ODQzMDMwNn0.v0VCl4BHt28MCHqd0cHiFeVDCv-2i0VL65QPUx4VK70';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── Auth ──────────────────────────────────────────────────────────────────────
client.auth.onAuthStateChange((event, session) => {
  if (session) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('admin-email').textContent = session.user.email;
    loadAll();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
  }
});

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  const btn   = document.getElementById('login-btn');
  const err   = document.getElementById('login-error');
  err.classList.remove('show');
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { error } = await client.auth.signInWithPassword({ email, password: pass });
  if (error) {
    err.textContent = error.message; err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}
async function doLogout() { await client.auth.signOut(); }
document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ── Tabs ──────────────────────────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}
function loadAll() { loadListings(); loadCharger(); loadMaintenance(); }

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(n) { return n ? Number(n).toLocaleString() : '—'; }
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function statusStatuses() { return ['pending','contacted','scheduled','completed','cancelled']; }

// ── Car Listings ──────────────────────────────────────────────────────────────
let allListings = []; let listingsFilter = 'all';

async function loadListings() {
  document.getElementById('listings-container').innerHTML = '<div class="loading"><div class="spinner"></div>Loading listings…</div>';
  const { data, error } = await client.from('car_listings').select('*').order('created_at', { ascending: false });
  if (error) { document.getElementById('listings-container').innerHTML = '<div class="empty">Error: ' + error.message + '</div>'; return; }
  allListings = data || [];
  document.getElementById('badge-listings').textContent = allListings.filter(l => l.status === 'pending').length;
  renderListings();
}

function filterListings(f, btn) {
  listingsFilter = f;
  document.querySelectorAll('#listings-filters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderListings();
}

function renderListings() {
  const items = listingsFilter === 'all' ? allListings : allListings.filter(l => l.status === listingsFilter);
  const el = document.getElementById('listings-container');
  if (!items.length) { el.innerHTML = '<div class="empty">No listings found.</div>'; return; }
  el.innerHTML = items.map(l => {
    const price = l.price ? fmt(l.price) + ' SAR' : (l.price_sar ? fmt(l.price_sar) + ' SAR' : '—');
    const km = l.km || l.mileage_km;
    const type = l.type || l.ev_type || 'BEV';
    return `<div class="card" id="listing-${l.id}">
      <div class="card-header">
        <div>
          <div class="car-title">${l.year || ''} ${l.make} ${l.model}</div>
          <div class="date-small">Submitted: ${fmtDate(l.created_at)}</div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          <div class="car-price">${price}</div>
          <span class="status-badge status-${l.status}">${l.status}</span>
        </div>
      </div>
      <div class="meta-grid">
        <div class="meta-item"><strong>${l.city||'—'}</strong>City</div>
        <div class="meta-item"><strong>${km ? fmt(km)+' km':'—'}</strong>Mileage</div>
        <div class="meta-item"><strong>${type}</strong>Type</div>
        <div class="meta-item"><strong>${l.range_km ? l.range_km+' km':'—'}</strong>Range</div>
        <div class="meta-item"><strong>${l.color||'—'}</strong>Color</div>
      </div>
      <div class="seller-block">
        <span>👤 <strong>${l.seller_name}</strong></span>
        <span>📞 <strong>${l.seller_phone}</strong></span>
        ${l.seller_email ? `<span>✉️ <strong>${l.seller_email}</strong></span>` : ''}
      </div>
      ${l.description ? `<div class="desc-text">📝 ${l.description}</div>` : ''}
      ${l.admin_note ? `<div class="desc-text" style="color:#f79090">🗒 Note: ${l.admin_note}</div>` : ''}
      <div class="card-actions">
        ${l.status === 'pending' ? `
          <input class="note-input" id="note-${l.id}" placeholder="Rejection note (optional)…">
          <button class="btn btn-primary" onclick="approveListing(${l.id})">✓ Approve</button>
          <button class="btn btn-danger"  onclick="rejectListing(${l.id})">✗ Reject</button>
        ` : ''}
        ${l.status === 'approved' ? `
          <button class="btn btn-gold" onclick="publishToMarket(${l.id})">🚀 Move to Live Cars</button>
        ` : ''}
      </div>
    </div>`;
  }).join('');
}

async function approveListing(id) {
  const { error } = await client.from('car_listings').update({ status:'approved', reviewed_at: new Date().toISOString() }).eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }
  loadListings();
}
async function rejectListing(id) {
  const note = document.getElementById('note-'+id)?.value.trim() || null;
  const { error } = await client.from('car_listings').update({ status:'rejected', admin_note:note, reviewed_at: new Date().toISOString() }).eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }
  loadListings();
}
async function publishToMarket(id) {
  const l = allListings.find(x => x.id === id); if (!l) return;
  const car = { make:l.make, model:l.model, year:l.year, price:l.price||l.price_sar, km:l.km||l.mileage_km||0, type:l.type||l.ev_type||'BEV', range_km:l.range_km, battery_pct:l.battery_pct, image_url:l.image_url, is_active:true };
  const { error } = await client.from('cars').insert([car]);
  if (error) { alert('Error publishing: ' + error.message); return; }
  alert('Car is now live on the marketplace!');
  loadListings();
}

// ── Charger Bookings ──────────────────────────────────────────────────────────
async function loadCharger() {
  document.getElementById('charger-container').innerHTML = '<div class="loading"><div class="spinner"></div>Loading…</div>';
  const { data, error } = await client.from('charger_bookings').select('*').order('created_at', { ascending: false });
  if (error) { document.getElementById('charger-container').innerHTML = '<div class="empty">Error: ' + error.message + '</div>'; return; }
  const items = data || [];
  document.getElementById('badge-charger').textContent = items.filter(b => b.status === 'pending').length;
  if (!items.length) { document.getElementById('charger-container').innerHTML = '<div class="empty">No charger bookings yet.</div>'; return; }
  document.getElementById('charger-container').innerHTML = items.map(b => {
    const name = b.name || b.full_name || '—';
    return `<div class="card">
      <div class="booking-row">
        <div class="booking-info">
          <div class="booking-name">${name}</div>
          <div class="booking-meta">
            📞 <strong>${b.phone||'—'}</strong> &nbsp;|&nbsp; 📍 <strong>${b.city||'—'}</strong><br>
            ⚡ <strong>${b.charger_type||'—'}</strong>${b.charger_power?' · '+b.charger_power:''}<br>
            💰 <strong>${b.estimated_price ? fmt(b.estimated_price)+' SAR':'—'}</strong><br>
            ${b.notes?'📝 '+b.notes+'<br>':''}
            <span class="date-small">📅 ${fmtDate(b.created_at)}</span>
          </div>
        </div>
        <div class="booking-right">
          <span class="status-badge status-${b.status||'pending'}">${b.status||'pending'}</span>
          <select class="status-select" onchange="updateChargerStatus(${b.id},this.value)">
            ${statusStatuses().map(s=>`<option value="${s}" ${b.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>`;
  }).join('');
}
async function updateChargerStatus(id, status) {
  const { error } = await client.from('charger_bookings').update({ status }).eq('id', id);
  if (error) alert('Error: ' + error.message); else loadCharger();
}

// ── Maintenance Bookings ──────────────────────────────────────────────────────
async function loadMaintenance() {
  document.getElementById('maintenance-container').innerHTML = '<div class="loading"><div class="spinner"></div>Loading…</div>';
  const { data, error } = await client.from('maintenance_bookings').select('*').order('created_at', { ascending: false });
  if (error) { document.getElementById('maintenance-container').innerHTML = '<div class="empty">Error: ' + error.message + '</div>'; return; }
  const items = data || [];
  document.getElementById('badge-maintenance').textContent = items.filter(b => b.status === 'pending').length;
  if (!items.length) { document.getElementById('maintenance-container').innerHTML = '<div class="empty">No maintenance bookings yet.</div>'; return; }
  document.getElementById('maintenance-container').innerHTML = items.map(b => {
    const name = b.full_name || b.name || '—';
    return `<div class="card">
      <div class="booking-row">
        <div class="booking-info">
          <div class="booking-name">${name}</div>
          <div class="booking-meta">
            📞 <strong>${b.phone||'—'}</strong> &nbsp;|&nbsp; 📍 <strong>${b.city||'—'}</strong><br>
            🔧 <strong>${b.service_type||'—'}</strong><br>
            🚗 <strong>${b.car_model||'—'}</strong>${b.car_year?' ('+b.car_year+')':''}<br>
            📅 Appt: <strong>${b.preferred_date||b.appt_date||'—'}</strong>${b.time_slot||b.appt_time?' at <strong>'+(b.time_slot||b.appt_time)+'</strong>':''}<br>
            💰 <strong>${b.estimated_cost?fmt(b.estimated_cost)+' SAR':'—'}</strong><br>
            ${b.notes?'📝 '+b.notes+'<br>':''}
            <span class="date-small">Submitted: ${fmtDate(b.created_at)}</span>
          </div>
        </div>
        <div class="booking-right">
          <span class="status-badge status-${b.status||'pending'}">${b.status||'pending'}</span>
          <select class="status-select" onchange="updateMaintenanceStatus(${b.id},this.value)">
            ${statusStatuses().map(s=>`<option value="${s}" ${b.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>`;
  }).join('');
}
async function updateMaintenanceStatus(id, status) {
  const { error } = await client.from('maintenance_bookings').update({ status }).eq('id', id);
  if (error) alert('Error: ' + error.message); else loadMaintenance();
}
</script>
</body>
</html>
